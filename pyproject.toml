[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brs-signals-mcp"
version = "0.1.4"
description = "Live Bitcoin market regime for agents: three sensors read pre-price data — fee curves, funding velocity, whale flows, absence — every 30s and reject almost everything. When they converge, a directional call is emitted with evidence. The data can't be reconstructed from history. Public, agent-auditable track record. MCP + REST + x402. Free tier, no card."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BRS Signals Team", email = "hello@brs-signals.com"},
]
keywords = [
    "bitcoin", "trading", "signals", "mcp", "model-context-protocol",
    "ai-agent", "crypto", "regime-detection", "on-chain",
    "claude-desktop", "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # server.py targets the mcp 1.x SDK: it imports mcp.server.fastmcp.FastMCP
    # and mcp.server.transport_security (DNS-rebinding protection), and calls
    # mcp.streamable_http_app(). mcp 2.0.0 restructured all of that, so the
    # upper bound is REQUIRED — an unbounded install picks up 2.0.0 and breaks
    # at import. (Upgrading to mcp 2.x is a separate build; verified live on 1.28.0.)
    "mcp>=1.28.0,<2.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
brs-mcp = "mcp_brs.server:main"

[project.urls]
Homepage = "https://brs-signals.com"
Documentation = "https://brs-signals.com/docs/guide"
Repository = "https://github.com/brssignals/BRS-Signals-MCP"
"Issues" = "https://github.com/brssignals/BRS-Signals-MCP/issues"
"X (Twitter)" = "https://x.com/brssignals"

[tool.hatch.build.targets.wheel]
# This pyproject lives inside the package dir (mcp_brs/). "packages =
# ['mcp_brs']" ships an EMPTY wheel and "packages = ['.']" flattens the files
# to the wheel root (breaks `import mcp_brs` + the brs-mcp entry point).
# force-include places the files under the mcp_brs/ namespace (Aug 17 catch).
packages = []
force-include = { "." = "mcp_brs" }

[tool.hatch.build.targets.wheel.exclude]
"/dist" = "*"
"/__pycache__" = "*"
"/*.pyc" = "*"
"/pyproject.toml" = "*"

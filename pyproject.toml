[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brs-signals-mcp"
version = "0.1.1"
description = "Live Bitcoin market regime for agents: three sensors read on-chain, off-chain and absence every 30s, reject almost everything, and emit a directional call with evidence when they converge. Public, agent-auditable track record. MCP + REST + x402. Free tier, no card."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BRS Signals Team", email = "hello@brs-signals.com"},
]
keywords = [
    "bitcoin", "trading", "signals", "mcp", "model-context-protocol",
    "ai-agent", "crypto", "regime-detection", "on-chain",
    "claude-desktop", "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
brs-mcp = "mcp_brs.server:main"

[project.urls]
Homepage = "https://brs-signals.com"
Documentation = "https://brs-signals.com/docs/guide"
Repository = "https://github.com/brssignals/BRS-Signals-MCP"
"Issues" = "https://github.com/brssignals/BRS-Signals-MCP/issues"
"X (Twitter)" = "https://x.com/brssignals"

[tool.hatch.build.targets.wheel]
packages = ["mcp_brs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brs-signals-mcp"
version = "0.1.0"
description = "₿RS Signals MCP Server — Bitcoin regime-switch detection for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
brs-mcp = "mcp_brs:main"

[project.urls]
Homepage = "https://brs-signals.com"
Documentation = "https://github.com/brssignals/BRS-Signals-MCP"
